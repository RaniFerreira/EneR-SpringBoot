<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EneR - Moradores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/listResident.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Conteúdo principal -->
    <div class="conteudo flex-grow-1">
        <div class="page-wrapper">

            <!-- Cabeçalho do painel -->
            <div class="page-header d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold list-titulo mb-0">👤 Moradores</h2>
                    <p class="text-muted mb-0" style="font-size: 12px;">Gerencie os moradores do condomínio</p>
                </div>
                <a th:href="@{/residents/novo}" class="btn btn-ener">+ Novo Morador</a>
            </div>

            <!-- Corpo do painel -->
            <div class="page-body">

                <!-- Mensagem caso não haja moradores cadastrados -->
                <div th:if="${#lists.isEmpty(residents)}" class="alert alert-info small">
                    Nenhum morador cadastrado ainda.
                </div>

                <!-- Tabela de moradores -->
                <div th:if="${not #lists.isEmpty(residents)}" class="table-responsive">
                    <table class="table table-hover align-middle ener-table mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nome Completo</th>
                                <th>CPF</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>WhatsApp</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="resident : ${residents}">
                                <td th:text="${resident.id}"></td>
                                <td th:text="${resident.fullName}"></td>
                                <td th:text="${resident.cpf}"></td>
                                <td th:text="${resident.email}"></td>
                                <td th:text="${resident.phone}"></td>
                                <td th:text="${resident.whatsapp}"></td>
                                <td class="text-center">
                                    <a th:href="@{/residents/editar/{id}(id=${resident.id})}"
                                       class="btn btn-sm btn-outline-success me-1">Editar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

   

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
