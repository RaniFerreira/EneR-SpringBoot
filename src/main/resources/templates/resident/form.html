<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${resident.id != null} ? 'EneR - Editar Morador' : 'EneR - Cadastrar Morador'">EneR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/formResident.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Conteúdo principal -->
    <div class="conteudo flex-grow-1">
        <div class="page-wrapper">

            <!-- Cabeçalho do painel -->
            <div class="page-header d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold form-titulo mb-0"
                        th:text="${resident.id != null} ? '✏️ Editar Morador' : '👤 Cadastrar Morador'">
                    </h2>
                    <p class="text-muted mb-0" style="font-size: 12px;">
                        Preencha os dados do morador
                    </p>
                </div>
                <a th:href="@{/residents}" class="btn btn-outline-secondary btn-sm">
                    ← Voltar
                </a>
            </div>

            <!-- Corpo do painel -->
            <div class="page-body">

                <!-- Mensagem de sucesso -->
                <div th:if="${msg}" class="alert alert-success py-2 small" th:text="${msg}"></div>

                <!-- Formulário -->
                <form th:action="${resident.id != null} ? @{/residents/atualizar} : @{/residents/salvar}"
                      th:object="${resident}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <!-- Dados Pessoais -->
                    <div class="form-section-titulo">Dados Pessoais</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" th:field="*{fullName}"
                                   placeholder="Nome completo" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">CPF</label>
                            <input type="text" class="form-control" th:field="*{cpf}"
                                   placeholder="000.000.000-00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Data de Nascimento</label>
                            <input type="date" class="form-control"
                                id="birthDate"
                                name="birthDate"
                                th:value="${resident.birthDate != null} ? ${#temporals.format(resident.birthDate, 'yyyy-MM-dd')} : ''"
                                required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Cidade de Nascimento</label>
                            <input type="text" class="form-control" th:field="*{birthCity}"
                                   placeholder="Cidade" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Profissão</label>
                            <input type="text" class="form-control" th:field="*{profession}"
                                   placeholder="Profissão">
                        </div>
                    </div>

                    <!-- Contato -->
                    <div class="form-section">
                        <div class="form-section-titulo">Contato</div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Telefone</label>
                                <input type="text" class="form-control" th:field="*{phone}"
                                       placeholder="(00) 00000-0000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">WhatsApp</label>
                                <input type="text" class="form-control" th:field="*{whatsapp}"
                                       placeholder="(00) 00000-0000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-control" th:field="*{email}"
                                       placeholder="email@exemplo.com" required>
                            </div>
                        </div>
                    </div>

                    <!-- Acesso ao Sistema -->
                    <div class="form-section">
                        <div class="form-section-titulo">Acesso ao Sistema</div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-control" name="plainPassword"
                                       th:placeholder="${resident.id != null} ? 'Deixe em branco para manter' : 'Digite a senha'"
                                       th:required="${resident.id == null}">
                                <small th:if="${resident.id != null}" class="text-muted">
                                    Deixe em branco para manter a senha atual.
                                </small>
                            </div>
                        </div>
                    </div>

                    <!-- Rodapé do painel com botões -->
                    <div class="page-footer mt-4 mx-n4 mb-n4 d-flex gap-2">
                        <button type="submit" class="btn btn-ener"
                                th:text="${resident.id != null} ? 'Salvar Alterações' : 'Cadastrar'">
                        </button>
                        <a th:href="@{/residents}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

  
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
