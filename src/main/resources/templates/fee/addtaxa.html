<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EneR - Vincular Taxa às Unidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/formResident.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Conteúdo principal -->
    <div class="conteudo flex-grow-1">
        <div class="page-wrapper">

            <!-- Cabeçalho do painel -->
            <div class="page-header d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold form-titulo mb-0">🔗 Vincular Taxa às Unidades</h2>
                    <p class="text-muted mb-0" style="font-size: 12px;">
                        Taxa: <strong th:text="${fee.type}"></strong>
                        - R$ <span th:text="${fee.amount}"></span>
                    </p>
                </div>
                <a th:href="@{/fees}" class="btn btn-outline-secondary btn-sm">
                    ← Voltar
                </a>
            </div>

            <!-- Corpo do painel -->
            <div class="page-body">

                <!-- Unidades já vinculadas -->
                <div class="form-section-titulo">Unidades Vinculadas</div>
                <table class="table table-sm table-hover mb-4">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Referência</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="unit : ${fee.units}">
                            <td th:text="${unit.number}"></td>
                            <td th:text="${unit.reference}"></td>
                            <td>
                                <a th:href="@{/fees/{id}/desvincular/{unitId}(id=${fee.id}, unitId=${unit.id})}"
                                   class="btn btn-sm btn-outline-danger">Desvincular</a>
                            </td>
                        </tr>
                        <tr th:if="${fee.units == null or fee.units.isEmpty()}">
                            <td colspan="3" class="text-center text-muted">Nenhuma unidade vinculada ainda.</td>
                        </tr>
                    </tbody>
                </table>

                <!-- Formulário para vincular nova unidade -->
                <div class="form-section-titulo">Vincular Nova Unidade</div>
                <form th:action="@{/fees/{id}/vincular(id=${fee.id})}" method="post">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <select class="form-control" name="unitId" required>
                                <option value="">Selecione uma unidade</option>
                                <option th:each="unit : ${units}"
                                        th:value="${unit.id}"
                                        th:text="${unit.number} + ' - ' + ${unit.reference}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-ener w-100">Vincular</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
