<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${fee.id != null} ? 'EneR - Editar Taxa' : 'EneR - Cadastrar Taxa'">EneR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/formResident.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Conteúdo principal -->
    <div class="conteudo flex-grow-1">
        <div class="page-wrapper">

            <!-- Cabeçalho do painel -->
            <div class="page-header d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold form-titulo mb-0"
                        th:text="${fee.id != null} ? '✏️ Editar Taxa' : '💰 Cadastrar Taxa'">
                    </h2>
                    <p class="text-muted mb-0" style="font-size: 12px;">
                        Cadastre a taxa, depois vincule às unidades desejadas
                    </p>
                </div>
                <a th:href="@{/fees}" class="btn btn-outline-secondary btn-sm">
                    ← Voltar
                </a>
            </div>

            <!-- Corpo do painel -->
            <div class="page-body">

                <!-- Formulário -->
                <form th:action="${fee.id != null} ? @{/fees/atualizar} : @{/fees/salvar}"
                      th:object="${fee}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <!-- Dados da Taxa -->
                    <div class="form-section-titulo">Dados da Taxa</div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Tipo</label>
                            <select class="form-control" th:field="*{type}" required>
                                <option value="">Selecione</option>
                                <option value="Manutenção">Manutenção</option>
                                <option value="Limpeza">Limpeza</option>
                                <option value="Segurança">Segurança</option>
                                <option value="Outros">Outros</option>
                            </select>
                            <p th:if="${#fields.hasErrors('type')}" class="text-danger small" th:errors="*{type}"></p>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Valor (R$)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{amount}"
                                   placeholder="Ex: 150.00" required>
                            <p th:if="${#fields.hasErrors('amount')}" class="text-danger small" th:errors="*{amount}"></p>
                        </div>
                        <div class="col-md-4" th:if="${fee.id != null}">
                            <label class="form-label">Status</label>
                            <select class="form-control" th:field="*{status}">
                                <option value="ATIVA">Ativa</option>
                                <option value="INATIVA">Inativa</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" th:field="*{description}" rows="3"
                                      placeholder="Detalhes adicionais sobre a taxa"></textarea>
                        </div>
                    </div>

                    <!-- Rodapé do painel com botões -->
                    <div class="page-footer mt-4 mx-n4 mb-n4 d-flex gap-2">
                        <button type="submit" class="btn btn-ener"
                                th:text="${fee.id != null} ? 'Salvar Alterações' : 'Cadastrar Taxa'">
                        </button>
                        <a th:href="@{/fees}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
