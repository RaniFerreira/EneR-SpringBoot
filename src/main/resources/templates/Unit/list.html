<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EneR - Unidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/listResident.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Conteúdo principal -->
    <div class="conteudo flex-grow-1">
        <div class="page-wrapper">

            <!-- Cabeçalho do painel -->
            <div class="page-header d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold list-titulo mb-0">🏢 Unidades</h2>
                    <p class="text-muted mb-0" style="font-size: 12px;">Gerencie as unidades do condomínio</p>
                </div>
                <a th:href="@{/units/novo}" class="btn btn-ener">+ Nova Unidade</a>
            </div>

            <!-- Corpo do painel -->
            <div class="page-body">

                <!-- Mensagem de sucesso -->
                <div th:if="${msg}" class="alert alert-success py-2 small" th:text="${msg}"></div>

                <!-- Mensagem caso não haja unidades cadastradas -->
                <div th:if="${#lists.isEmpty(units)}" class="alert alert-info small">
                    Nenhuma unidade cadastrada ainda.
                </div>

                <!-- Tabela de unidades -->
                <div th:if="${not #lists.isEmpty(units)}" class="table-responsive">
                    <table class="table table-hover align-middle ener-table mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Tipo</th>
                                <th>Número</th>
                                <th>Referência</th>
                                <th>Moradores Responsáveis</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="unit : ${units}">
                                <td th:text="${unit.id}"></td>
                                <td th:text="${unit.type}"></td>
                                <td th:text="${unit.number}"></td>
                                <td th:text="${unit.reference}"></td>
                                <td>
                                    <span th:if="${#lists.isEmpty(unit.residents)}" class="text-muted small">Nenhum vinculado</span>
                                    <span th:each="resident, iter : ${unit.residents}">
                                        <span th:text="${resident.fullName}"></span><span th:if="${!iter.last}">, </span>
                                    </span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/sindico/units/editar/{id}(id=${unit.id})}"
                                       class="btn btn-sm btn-outline-success me-1">Editar</a>
                                    <a th:href="@{/sindico/units/excluir/{id}(id=${unit.id})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Tem certeza que deseja excluir esta unidade?')">
                                       Excluir
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

   

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
