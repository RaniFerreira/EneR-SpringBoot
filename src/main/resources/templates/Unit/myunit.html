<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EneR - Minha Unidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/listResident.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="conteudo flex-grow-1">
        <div class="page-wrapper">

            <div class="page-header d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold list-titulo mb-0">🏠 Minha Unidade</h2>
                    <p class="text-muted mb-0" style="font-size: 12px;">Unidades vinculadas à sua conta</p>
                </div>
            </div>

            <div class="page-body">

                <div th:if="${#lists.isEmpty(units)}" class="alert alert-info small">
                    Nenhuma unidade vinculada à sua conta.
                </div>

                <div th:if="${not #lists.isEmpty(units)}" class="table-responsive">
                    <table class="table table-hover align-middle ener-table mb-0">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Número</th>
                                <th>Referência</th>
                                <th class="text-center">Leituras</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="unit : ${units}">
                                <td th:text="${unit.type}"></td>
                                <td th:text="${unit.number}"></td>
                                <td th:text="${unit.reference}"></td>
                                <td class="text-center">
                                    <a th:href="@{/units/{id}/readings/myreading(id=${unit.id})}"
                                       class="btn btn-sm btn-outline-primary">⚡ Ver Leituras</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
