<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${unit.id != null} ? 'EneR - Editar Unidade' : 'EneR - Cadastrar Unidade'">EneR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/formResident.css}">
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Conteúdo principal -->
    <div class="conteudo flex-grow-1">
        <div class="page-wrapper">

            <!-- Cabeçalho do painel -->
            <div class="page-header d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold form-titulo mb-0"
                        th:text="${unit.id != null} ? '✏️ Editar Unidade' : '🏢 Cadastrar Unidade'">
                    </h2>
                    <p class="text-muted mb-0" style="font-size: 12px;">
                        Preencha os dados da unidade
                    </p>
                </div>
                <a th:href="@{/sindico/units}" class="btn btn-outline-secondary btn-sm">
                    ← Voltar
                </a>
            </div>

            <!-- Corpo do painel -->
            <div class="page-body">

                <!-- Mensagem de erro (ex: unidade duplicada) -->
                <div th:if="${erro}" class="alert alert-danger py-2 small" th:text="${erro}"></div>

                <!-- Formulário -->
                <form th:action="${unit.id != null} ? @{/units/atualizar} : @{/units/salvar}"
                      th:object="${unit}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <!-- Dados da Unidade -->
                    <div class="form-section-titulo">Dados da Unidade</div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Tipo</label>
                            <select class="form-control" th:field="*{type}" required>
                                <option value="">Selecione</option>
                                <option value="Casa">Casa</option>
                                <option value="Apartamento">Apartamento</option>
                                <option value="Lote">Lote</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Número</label>
                            <input type="text" class="form-control" th:field="*{number}"
                                   placeholder="Ex: 101" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Referência</label>
                            <input type="text" class="form-control" th:field="*{reference}"
                                   placeholder="Ex: Bloco A, Quadra 2">
                        </div>
                    </div>

                    <!-- Moradores Responsáveis -->
                    <div class="form-section">
                        <div class="form-section-titulo">Moradores Responsáveis</div>
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Selecione um ou mais moradores</label>
                                <select class="form-control" th:field="*{residents}" multiple size="6">
                                    <option th:each="resident : ${residents}"
                                            th:value="${resident.id}"
                                            th:text="${resident.fullName} + ' - ' + ${resident.cpf}">
                                    </option>
                                </select>
                                <small class="text-muted">Segure Ctrl (ou Cmd no Mac) para selecionar mais de um morador.</small>
                            </div>
                        </div>
                    </div>

                    <!-- Rodapé do painel com botões -->
                    <div class="page-footer mt-4 mx-n4 mb-n4 d-flex gap-2">
                        <button type="submit" class="btn btn-ener"
                                th:text="${unit.id != null} ? 'Salvar Alterações' : 'Cadastrar'">
                        </button>
                        <a th:href="@{/sindico/units}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

  

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
